<title>cua settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #f6f6f4; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e6e6e3; --accent: #1f6feb; --ok: #1a7f37; --bad: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --card: #1f1f1f; --fg: #ececec; --muted: #9a9a9a; --line: #2e2e2e; --accent: #4c9aff; --ok: #3fb950; --bad: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 16px; }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; padding: 14px 16px 6px; }
  .row { display: grid; grid-template-columns: 1fr 240px; gap: 12px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row label { font-weight: 500; }
  .row small { display: block; color: var(--muted); font-weight: 400; }
  input[type=text], input[type=number], select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--fg); font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; justify-self: start; accent-color: var(--accent); }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; padding: 12px 16px 16px; }
  .pill { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
  .pill b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 16px; }
  button { font: inherit; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; display: flex; justify-content: center; gap: 10px;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  #toast { color: var(--muted); align-self: center; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>

<main>
  <h1>cua</h1>
  <p class="sub">Background browser and computer use for any agent harness. Changes apply live.</p>

  <section>
    <h2>Status</h2>
    <div class="status" id="status">Loading…</div>
    <div class="actions">
      <button id="openBrowser">Open live browser</button>
      <button id="showHud">Show HUD</button>
      <button id="restart">Restart browser</button>
    </div>
  </section>
  <div id="form"></div>
</main>
<div class="savebar"><span id="toast"></span><button id="reset">Discard</button><button class="primary" id="save">Save</button></div>

<script>
const T = "{{TOKEN}}";
const api = (p, body) => fetch(p + "?t=" + T, body !== undefined ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {}).then((r) => r.json());

const SECTIONS = { browser: "Browser", snapshot: "Reading pages & apps", native: "Native apps", stream: "Live stream",
  hud: "HUD", web: "Web UI", repl: "Sessions" };
const ENUMS = {
  "browser.dialogs": ["report", "accept", "dismiss"],
  "hud.mode": ["attached", "overlay", "normal"],
  "hud.anchor": ["bottom-right", "bottom-left", "top-right", "top-left", "center"],
  "hud.controlsCorner": ["top-left", "top-right", "bottom-left", "bottom-right"],
  "hud.glyphTint": ["auto", "light", "dark"],
};
const HELP = {
  "browser.headless": "Off shows a real browser window (it may take focus once at launch).",
  "browser.attach": "CDP URL of a browser you started with --remote-debugging-port, e.g. http://127.0.0.1:9222. Blank = cua's own browser.",
  "browser.executable": "“auto” picks Chrome, Chromium, Helium, Brave or Edge.",
  "browser.profile": "Separate profiles keep separate logins.",
  "browser.dialogs": "What to do with alert/confirm/prompt dialogs.",
  "snapshot.diff": "Return only what changed since the last read.",
  "native.allowKeyEvents": "Keyboard events sent to the target app only - never global.",
  "hud.mode": "attached pins to the host app and hides with it; overlay floats above everything.",
  "hud.attachTo": "App the HUD attaches to (Claude, Antigravity, Cursor…).",
  "hud.showAgentCursor": "Draw the agent's own cursor on the preview.",
  "hud.glyphClose": "Any SF Symbol name.", "hud.glyphAction": "Any SF Symbol name.",
  "web.port": "Takes effect after the daemon restarts.",
};

let current, defaults;
const get = (o, path) => path.split(".").reduce((a, k) => a?.[k], o);
const set = (o, path, v) => { const ks = path.split("."); ks.slice(0, -1).reduce((a, k) => (a[k] ??= {}), o)[ks.at(-1)] = v; };

function field(path, def, val) {
  const row = document.createElement("div");
  row.className = "row";
  const key = path.split(".").pop();
  const label = key.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
  row.innerHTML = `<label>${label}${HELP[path] ? `<small>${HELP[path]}</small>` : ""}</label>`;
  let input;
  if (ENUMS[path]) {
    input = document.createElement("select");
    for (const o of ENUMS[path]) input.add(new Option(o, o, false, o === val));
  } else if (typeof def === "boolean") {
    input = Object.assign(document.createElement("input"), { type: "checkbox", checked: !!val });
  } else if (typeof def === "number") {
    input = Object.assign(document.createElement("input"), { type: "number", value: val, step: Number.isInteger(def) ? 1 : 0.01 });
  } else {
    input = Object.assign(document.createElement("input"), { type: "text", value: val ?? "" });
  }
  input.dataset.path = path;
  row.append(input);
  return row;
}

function build() {
  const form = document.getElementById("form");
  form.innerHTML = "";
  for (const [sec, title] of Object.entries(SECTIONS)) {
    const s = document.createElement("section");
    s.innerHTML = `<h2>${title}</h2>`;
    const walk = (obj, prefix) => {
      for (const [k, def] of Object.entries(obj)) {
        const p = `${prefix}.${k}`;
        if (def && typeof def === "object" && !Array.isArray(def)) walk(def, p);
        else s.append(field(p, def, get(current, p)));
      }
    };
    walk(defaults[sec], sec);
    form.append(s);
  }
}

function collect() {
  const out = structuredClone(current);
  for (const el of document.querySelectorAll("[data-path]")) {
    const p = el.dataset.path, def = get(defaults, p);
    set(out, p, el.type === "checkbox" ? el.checked : typeof def === "number" ? Number(el.value) : el.value);
  }
  return out;
}

async function load() { ({ config: current, defaults } = await api("/api/config")); build(); }

async function status() {
  const s = await api("/api/status");
  const a = s.agent ?? {};
  const pill = (t, v, ok) => `<div class="pill"><b>${t}</b><span class="${ok === undefined ? "" : ok ? "ok" : "bad"}">${v}</span></div>`;
  document.getElementById("status").innerHTML = [
    pill("Browser", s.browser.running ? `running · ${s.browser.tabs} tab(s)` : "idle (starts on first use)"),
    pill("Native agent", a.reachable ? "connected" : "starts on first native-app use", a.reachable ? true : undefined),
    pill("Accessibility", a.reachable ? (a.accessibility ? "granted" : "not granted") : "—", a.reachable ? a.accessibility : undefined),
    pill("Screen Recording", a.reachable ? (a.screenRecording ? "granted" : "not granted") : "—", a.reachable ? a.screenRecording : undefined),
    pill("Sessions", `${s.sessions} connected`),
  ].join("");
}

document.getElementById("save").onclick = async () => {
  ({ config: current } = await api("/api/config", collect()));
  document.getElementById("toast").textContent = "Saved · applied live";
  setTimeout(() => (document.getElementById("toast").textContent = ""), 2500);
};
document.getElementById("reset").onclick = build;
document.getElementById("openBrowser").onclick = () => open("/?t=" + T, "_blank");
document.getElementById("showHud").onclick = () => api("/api/hud/show", {});
document.getElementById("restart").onclick = async () => { await api("/api/browser/restart", {}); status(); };

load(); status(); setInterval(status, 4000);
</script>
