<title>cua browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #161616; --chrome: #1c1c1c; --pill: #2a2a2a; --pill-hi: #333; --line: #2b2b2b;
    --fg: #e8e8e8; --muted: #8d8d8d; --accent: #339cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--chrome); }
  .tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 200px; padding: 5px 6px 5px 10px;
    border-radius: 8px; color: var(--muted); cursor: default; white-space: nowrap; }
  .tab.on { background: var(--pill); color: var(--fg); }
  .tab:hover:not(.on) { background: #222; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { opacity: .55; border-radius: 4px; padding: 0 4px; }
  .tab .x:hover { opacity: 1; background: var(--pill-hi); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  button.icon { background: none; border: 0; color: var(--muted); font-size: 15px; width: 28px; height: 26px;
    border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  button.icon:hover { color: var(--fg); background: var(--pill); }
  button.icon:disabled { opacity: .35; cursor: default; background: none; }
  .nav { border-bottom: 1px solid var(--line); padding-top: 2px; }
  #url { flex: 1; background: none; border: 0; outline: 0; color: var(--fg); text-align: center;
    font: inherit; padding: 5px 8px; border-radius: 6px; }
  #url:focus { background: var(--pill); text-align: left; }
  .who { font-size: 11px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
  .stage { position: relative; flex: 1; min-height: 0; background: #0f0f0f; outline: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none;
    -webkit-user-drag: none; }
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s; opacity: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  .ripple { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 2px solid var(--accent); pointer-events: none; animation: rip .55s ease-out forwards; }
  @keyframes rip { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  a.icon { color: var(--muted); text-decoration: none; }
</style>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <button class="icon" id="newTab" title="New tab">+</button>
  <a class="icon" id="settings" title="Settings" style="display:grid;place-items:center;width:28px;height:26px">⚙︎</a>
</div>
<div class="bar nav">
  <button class="icon" id="back" title="Back">←</button>
  <button class="icon" id="fwd" title="Forward">→</button>
  <button class="icon" id="reload" title="Reload">⟳</button>
  <input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
  <span class="who" id="who"></span>
</div>
<div class="stage" id="stage" tabindex="0">
  <img id="view" alt="">
  <div class="empty" id="empty">No page yet — the agent opens tabs here, or type an address above.</div>
  <svg id="cursor" viewBox="0 0 22 22"><path d="M3 2 L3 17 L7 13.2 L9.6 19 L12.2 17.9 L9.7 12.2 L15 12.2 Z"
    fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
</div>

<script>
const T = "{{TOKEN}}";
const q = (s) => document.querySelector(s);
const api = (path, body) => fetch(path + (path.includes("?") ? "&" : "?") + "t=" + T, body ? {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {}).then((r) => r.json());
const nav = (action, extra = {}) => api("/api/nav", { action, ...extra });

q("#settings").href = "/settings?t=" + T;
const view = q("#view"), stage = q("#stage"), cursor = q("#cursor");
view.src = "/stream?t=" + T;
view.onload = () => (q("#empty").style.display = "none");

let state = { tabs: [] };
function render() {
  const tabs = q("#tabs");
  tabs.innerHTML = "";
  for (const t of state.tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (t.active ? " on" : "");
    el.innerHTML = `${t.active ? '<span class="dot"></span>' : ""}<span class="t"></span><span class="x" title="Close">✕</span>`;
    el.querySelector(".t").textContent = t.title || t.url || "New tab";
    el.onclick = (e) => e.target.classList.contains("x") ? nav("close", { tabId: t.id }) : nav("select", { tabId: t.id });
    tabs.append(el);
  }
  const active = state.tabs.find((t) => t.active);
  if (document.activeElement !== q("#url")) q("#url").value = active?.url && active.url !== "about:blank" ? active.url : "";
  q("#who").textContent = state.running ? (state.source === "native" ? "agent · native app" : "agent · browser") : "browser idle";
  q("#empty").style.display = active ? "none" : "grid";
}

// the agent's own cursor, drawn over the frame
function imageRect() {
  const r = stage.getBoundingClientRect(), nw = view.naturalWidth || 16, nh = view.naturalHeight || 9;
  const s = Math.min(r.width / nw, r.height / nh), w = nw * s, h = nh * s;
  return { x: (r.width - w) / 2, y: (r.height - h) / 2, w, h };
}
function showCursor(c) {
  if (c.source === "native" || c.app) return;
  const r = imageRect(), x = r.x + c.x * r.w, y = r.y + c.y * r.h;
  cursor.style.opacity = 1;
  cursor.style.transform = `translate(${x - 3}px, ${y - 2}px)`;
  if (c.kind === "click") setTimeout(() => {
    const d = document.createElement("div");
    d.className = "ripple"; d.style.left = x + "px"; d.style.top = y + "px";
    stage.append(d); setTimeout(() => d.remove(), 600);
  }, 300);
}

const es = new EventSource("/events?t=" + T);
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.type === "state") { state = ev; render(); }
  if (ev.type === "cursor") showCursor(ev);
};

q("#newTab").onclick = () => nav("new");
q("#back").onclick = () => nav("back");
q("#fwd").onclick = () => nav("forward");
q("#reload").onclick = () => nav("reload");
q("#url").onkeydown = (e) => {
  if (e.key !== "Enter") return;
  let v = e.target.value.trim();
  if (!v) return;
  if (!/^[a-z]+:\/\//i.test(v)) v = /\s/.test(v) || !/\./.test(v) ? "https://duckduckgo.com/?q=" + encodeURIComponent(v) : "https://" + v;
  nav(state.tabs.length ? "goto" : "new", { url: v });
  stage.focus();
};

// taking over: your input goes to the page itself, never to the OS
const norm = (e) => {
  const r = imageRect(), b = stage.getBoundingClientRect();
  return { nx: (e.clientX - b.left - r.x) / r.w, ny: (e.clientY - b.top - r.y) / r.h };
};
const mods = (e) => ({ alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey, shift: e.shiftKey });
const input = (ev) => api("/api/input", ev);
let lastMove = 0;
stage.addEventListener("mousedown", (e) => { stage.focus(); input({ type: "down", ...norm(e), ...mods(e), clickCount: e.detail || 1, button: ["left", "middle", "right"][e.button] }); e.preventDefault(); });
stage.addEventListener("mouseup", (e) => input({ type: "up", ...norm(e), ...mods(e), clickCount: e.detail || 1, button: ["left", "middle", "right"][e.button] }));
stage.addEventListener("mousemove", (e) => { const n = Date.now(); if (n - lastMove > 40) { lastMove = n; input({ type: "move", ...norm(e) }); } });
stage.addEventListener("wheel", (e) => { input({ type: "wheel", ...norm(e), dx: e.deltaX, dy: e.deltaY }); e.preventDefault(); }, { passive: false });
stage.addEventListener("contextmenu", (e) => e.preventDefault());
stage.addEventListener("keydown", (e) => {
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) input({ type: "text", text: e.key });
  else input({ type: "key", key: e.key, code: e.code, keyCode: e.keyCode, ...mods(e) });
  e.preventDefault();
});
stage.addEventListener("paste", (e) => { input({ type: "text", text: e.clipboardData.getData("text") }); e.preventDefault(); });
</script>
