<title>cua browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #161616; --chrome: #1c1c1c; --pill: #2a2a2a; --pill-hi: #333; --line: #2b2b2b;
    --fg: #e8e8e8; --muted: #8d8d8d; --accent: #339cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--chrome); }
  .tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 200px; padding: 5px 6px 5px 10px;
    border-radius: 8px; color: var(--muted); cursor: default; white-space: nowrap; }
  .tab.on { background: var(--pill); color: var(--fg); }
  .tab:hover:not(.on) { background: #222; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { opacity: .55; border-radius: 4px; padding: 0 4px; }
  .tab .x:hover { opacity: 1; background: var(--pill-hi); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  button.icon { background: none; border: 0; color: var(--muted); font-size: 15px; width: 28px; height: 26px;
    border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  button.icon:hover { color: var(--fg); background: var(--pill); }
  button.icon:disabled { opacity: .35; cursor: default; background: none; }
  .nav { border-bottom: 1px solid var(--line); padding-top: 2px; }
  #url { flex: 1; background: none; border: 0; outline: 0; color: var(--fg); text-align: center;
    font: inherit; padding: 5px 8px; border-radius: 6px; }
  #url:focus { background: var(--pill); text-align: left; }
  .who { font-size: 11px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
  .stage { position: relative; flex: 1; min-height: 0; background: #0f0f0f; outline: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cursorLayer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  a.icon { color: var(--muted); text-decoration: none; }
</style>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <button class="icon" id="newTab" title="New tab">+</button>
  <a class="icon" id="settings" title="Settings" style="display:grid;place-items:center;width:28px;height:26px">⚙︎</a>
</div>
<div class="bar nav">
  <button class="icon" id="back" title="Back">←</button>
  <button class="icon" id="fwd" title="Forward">→</button>
  <button class="icon" id="reload" title="Reload">⟳</button>
  <input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
  <span class="who" id="who"></span>
</div>
<div class="stage" id="stage" tabindex="0">
  <canvas id="view"></canvas>
  <div class="empty" id="empty">No page yet — the agent opens tabs here, or type an address above.</div>
  <div id="cursorLayer"></div>
</div>
<script src="/cursor.js?t={{TOKEN}}"></script>

<script>
const T = "{{TOKEN}}";
const SEARCH_URL = "{{SEARCH_URL}}";
const q = (s) => document.querySelector(s);
q("#settings").href = "/settings?t=" + T;
const view = q("#view"), stage = q("#stage"), ctx = view.getContext("2d");
const cursor = AgentCursor(q("#cursorLayer"), { color: "{{CURSOR_COLOR}}", onArrived: (seq) => send({ type: "arrived", seq }) });

// ---- one WebSocket: binary frames in; JSON state/cursor in; JSON input/nav/viewport out ----
let ws, state = { tabs: [] }, frameSize = { w: 1, h: 1 };
const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));
const nav = (action, extra = {}) => send({ type: "nav", action, ...extra });

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?t=${T}`);
  ws.binaryType = "blob";
  ws.onopen = () => { send({ type: "hello", animatesCursor: true }); reportViewport(); };
  ws.onclose = () => setTimeout(connect, 800);
  let drawing = false, pending = null;
  ws.onmessage = async (e) => {
    if (typeof e.data === "string") {
      const ev = JSON.parse(e.data);
      if (ev.type === "state") { state = ev; render(); }
      if (ev.type === "cursor") showCursor(ev);
      return;
    }
    // draw the newest frame only; if one is still decoding, keep just the latest
    pending = e.data;
    if (drawing) return;
    drawing = true;
    while (pending) {
      const blob = pending; pending = null;
      try {
        const bmp = await createImageBitmap(blob);
        frameSize = { w: bmp.width, h: bmp.height };
        const r = frameRect();
        ctx.clearRect(0, 0, view.width, view.height);
        ctx.drawImage(bmp, r.x * dpr(), r.y * dpr(), r.w * dpr(), r.h * dpr());
        bmp.close();
        q("#empty").style.display = "none";
      } catch {}
    }
    drawing = false;
  };
}

const dpr = () => window.devicePixelRatio || 1;
// the page renders at exactly the stage size, so aspect-fit fills it; it only letterboxes
// for a moment while a resize catches up
function frameRect() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.min(W / frameSize.w, H / frameSize.h);
  const w = frameSize.w * s, h = frameSize.h * s;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function sizeCanvas() {
  view.width = Math.round(stage.clientWidth * dpr());
  view.height = Math.round(stage.clientHeight * dpr());
}
let vpTimer;
function reportViewport() {
  sizeCanvas();
  clearTimeout(vpTimer);
  vpTimer = setTimeout(() => send({ type: "viewport", w: stage.clientWidth, h: stage.clientHeight, dpr: dpr() }), 60);
}
new ResizeObserver(reportViewport).observe(stage);

function render() {
  const tabs = q("#tabs");
  tabs.innerHTML = "";
  for (const t of state.tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (t.active ? " on" : "");
    el.innerHTML = `${t.active ? '<span class="dot"></span>' : ""}<span class="t"></span><span class="x" title="Close">✕</span>`;
    el.querySelector(".t").textContent = t.title || t.url || "New tab";
    el.onclick = (e) => e.target.classList.contains("x") ? nav("close", { tabId: t.id }) : nav("select", { tabId: t.id });
    tabs.append(el);
  }
  const active = state.tabs.find((t) => t.active);
  if (document.activeElement !== q("#url")) q("#url").value = active?.url && active.url !== "about:blank" ? active.url : "";
  q("#who").textContent = state.sessionName ?? (state.running ? (state.source === "native" ? "agent · native app" : "agent · browser") : "browser idle");
  if (!active) q("#empty").style.display = "grid";
}

// the agent's own cursor, drawn over the frame; it tells the agent when it has arrived
function showCursor(c) {
  if (c.source === "native" || c.app) { if (c.seq != null) send({ type: "arrived", seq: c.seq }); return; }
  const r = frameRect();
  cursor.moveTo(r.x + c.x * r.w, r.y + c.y * r.h, { seq: c.seq ?? null, click: c.kind === "click", animate: !document.hidden });
}

q("#newTab").onclick = () => nav("new");
q("#back").onclick = () => nav("back");
q("#fwd").onclick = () => nav("forward");
q("#reload").onclick = () => nav("reload");
q("#url").onkeydown = (e) => {
  if (e.key !== "Enter") return;
  let v = e.target.value.trim();
  if (!v) return;
  if (!/^[a-z]+:\/\//i.test(v)) v = /\s/.test(v) || !/\./.test(v) ? SEARCH_URL.replace("%s", encodeURIComponent(v)) : "https://" + v;
  nav(state.tabs.length ? "goto" : "new", { url: v });
  stage.focus();
};

// taking over: your input goes to the page itself, never to the OS
const norm = (e) => {
  const r = frameRect(), b = stage.getBoundingClientRect();
  return { nx: (e.clientX - b.left - r.x) / r.w, ny: (e.clientY - b.top - r.y) / r.h };
};
const mods = (e) => ({ alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey, shift: e.shiftKey });
const btn = (e) => ["left", "middle", "right"][e.button];
let moveQueued = null;
stage.addEventListener("mousedown", (e) => { stage.focus(); send({ type: "down", ...norm(e), ...mods(e), clickCount: e.detail || 1, button: btn(e) }); e.preventDefault(); });
stage.addEventListener("mouseup", (e) => send({ type: "up", ...norm(e), ...mods(e), clickCount: e.detail || 1, button: btn(e) }));
stage.addEventListener("mousemove", (e) => {
  const m = { type: "move", ...norm(e) };
  if (!moveQueued) requestAnimationFrame(() => { send(moveQueued); moveQueued = null; });
  moveQueued = m;
});
stage.addEventListener("wheel", (e) => { send({ type: "wheel", ...norm(e), dx: e.deltaX, dy: e.deltaY }); e.preventDefault(); }, { passive: false });
stage.addEventListener("contextmenu", (e) => e.preventDefault());
stage.addEventListener("keydown", (e) => {
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) send({ type: "text", text: e.key });
  else send({ type: "key", key: e.key, code: e.code, keyCode: e.keyCode, ...mods(e) });
  e.preventDefault();
});
stage.addEventListener("paste", (e) => { send({ type: "text", text: e.clipboardData.getData("text") }); e.preventDefault(); });

connect();
</script>
